# comment.yaml —— 评论系统配置 Comment system configuration
# 覆盖主题的 src/config/commentConfig.ts
# Overrides src/config/commentConfig.ts
# 遵循零额外负担原则：关闭时不产生外部网络请求、零额外 DOM 占位与零包体积
# Zero-overhead principle: when disabled, no external requests, zero extra DOM, zero bundle size

# 是否全局启用评论系统 / Globally enable the comment system
enable: false

# 评论服务提供商 / Comment provider
# "none" 不启用，"twikoo" 或 "giscus" 二选一
# "none" to disable, or choose "twikoo" or "giscus"
provider: "none"

# 是否开启视口懒加载，滚动至评论区视口时才动态拉取脚本
# Enable viewport lazy loading; fetch scripts only when scrolling to comment section
lazy: true

# Twikoo 专有配置，当 provider 为 "twikoo" 时填写
# Twikoo-specific settings; fill in when provider is "twikoo"
twikoo:
  # Twikoo 环境 ID，如私有部署地址或云环境 ID
  # Twikoo environment ID (private deployment URL or cloud environment ID)
  envId: ""
  # 前端脚本资源地址 / Frontend script URL
  scriptUrl: "https://cdn.jsdelivr.net/npm/twikoo@1.7.20/dist/twikoo.min.js"
  # 语言 / Language
  # "auto" 表示跟随站点，或直接指定 "zh-CN"、"en"、"ja"
  # "auto" follows the site, or specify "zh-CN", "en", "ja"
  lang: "auto"
  # 输入框占位提示文本 / Input placeholder text
  placeholder: "Share your thoughts..."

# Giscus 专有配置，当 provider 为 "giscus" 时填写
# Giscus-specific settings; fill in when provider is "giscus"
# 基于 GitHub Discussions 存储评论，无需自建后端；仅要求一个开启 Discussions 的公开仓库
# Stores comments via GitHub Discussions; no backend required, just a public repo with Discussions enabled
# repo / repoId / categoryId 三者必填（从 https://giscus.app 配置生成器获取），
# repo, repoId, and categoryId are all required (obtain from https://giscus.app config generator)
# 任一缺失时评论区静默关闭，与未启用完全等价（零额外负担）
# If any are missing, the comment section silently disables (equivalent to not enabled, zero overhead)
giscus:
  # 公开 GitHub 仓库，格式 "owner/repo"（需开启 Discussions 并安装 giscus App）
  # Public GitHub repo in "owner/repo" format (Discussions enabled, giscus App installed)
  repo: ""
  # 仓库 ID（giscus.app 生成） / Repo ID (generated by giscus.app)
  repoId: ""
  # Discussion 分类名，推荐 "Announcements"（仅维护者可开新讨论，避免访客误开主题帖）
  # Discussion category name; "Announcements" recommended (only maintainers can start new discussions)
  category: "Announcements"
  # 分类 ID（giscus.app 生成） / Category ID (generated by giscus.app)
  categoryId: ""
  # 页面与 Discussion 的映射方式 / Page-to-Discussion mapping
  # pathname | url | title | og:title | specific | number
  mapping: "pathname"
  # 严格标题匹配（SHA-1 校验），避免 GitHub 模糊搜索误配相似标题
  # Strict title matching (SHA-1) to prevent GitHub fuzzy search from mismatching similar titles
  strict: false
  # 是否显示主贴表情反应 / Show emoji reactions on the main post
  reactionsEnabled: true
  # 是否向页面发送 Discussion 元数据（一般保持 false）
  # Send Discussion metadata to the page (usually keep false)
  emitMetadata: false
  # 评论输入框位置 / Comment input position
  # "bottom"（评论框在列表下方）| "top"（评论框在列表上方）
  # "bottom" (below list) | "top" (above list)
  inputPosition: "bottom"
  # 明暗两套 giscus 主题（主题键或自定义主题 CSS URL），自动跟随站点明暗切换
  # Light/dark giscus themes (theme keys or custom CSS URLs), auto-switch with site theme
  theme:
    light: "light"
    dark: "dark"
  # 评论语言 / Comment language
  # "auto" 跟随站点语言，或 giscus 语言码（如 "zh-CN"、"en"）
  # "auto" follows site language, or giscus language code (e.g. "zh-CN", "en")
  lang: "auto"
  # giscus client.js 地址；自托管 giscus 时替换为自有地址
  # giscus client.js URL; replace with your own if self-hosting
  scriptUrl: "https://giscus.app/client.js"
