# ┌──────────────────────────────────────────────────────────
# │ 评论系统配置
# │ 覆盖配置：src/config/commentConfig.ts
# │ 遵循零额外负担原则：关闭时不产生外部网络请求、零额外 DOM 占位与零包体积
# │
# │ Comment system configuration
# │ Overrides: src/config/commentConfig.ts
# │ Zero-overhead principle: no external requests, DOM, or bundle size when disabled
# └──────────────────────────────────────────────────────────

# 是否全局启用评论系统 | Globally enable the comment system
enable: false

# 评论服务提供商
# ├─ none   : 不启用
# ├─ twikoo : 使用 Twikoo
# ├─ giscus : 使用 Giscus
# └─ waline : 使用 Waline
#
# Comment provider
# ├─ none   : Disabled
# ├─ twikoo : Use Twikoo
# ├─ giscus : Use Giscus
# └─ waline : Use Waline
provider: "none"

# 是否开启视口懒加载，滚动至评论区视口时才动态拉取脚本
#
# Enable viewport lazy loading; fetch scripts only when scrolling to comment section
lazy: true

# Twikoo 专有配置，当 provider 为 "twikoo" 时填写
#
# Twikoo-specific settings; fill in when provider is "twikoo"
twikoo:
  # Twikoo 环境 ID，如私有部署地址或云环境 ID
  #
  # Twikoo environment ID (private deployment URL or cloud environment ID)
  envId: ""
  # 前端脚本资源地址 | Frontend script URL
  scriptUrl: "https://cdn.jsdelivr.net/npm/twikoo@1.7.20/dist/twikoo.min.js"
  # 语言 | Language
  # "auto" 表示跟随站点，或直接指定 "zh-CN"、"en"、"ja"
  #
  # "auto" follows the site, or specify "zh-CN", "en", "ja"
  lang: "auto"
  # 输入框占位提示文本 | Input placeholder text
  placeholder: "Share your thoughts..."

# ┌─ ⚠️ Giscus 前置要求与注意事项 | Requirements & Notice ──
# │ 基于 GitHub Discussions 存储评论，无需自建后端，仅需开启 Discussions 的公开仓库。
# │ repo、repoId、categoryId 三者必填（从 https://giscus.app 配置生成器获取）；
# │ 任一缺失时评论区静默关闭，等价于未启用（零额外负担）。
# │
# │ Comments are stored via GitHub Discussions; no backend required.
# │ repo, repoId, and categoryId are required (from https://giscus.app).
# │ If any are missing, comments silently disable (zero overhead).
# └──────────────────────────────────────────────────────────
giscus:
  # 公开 GitHub 仓库，格式 "owner/repo"（需开启 Discussions 并安装 giscus App）
  #
  # Public GitHub repo in "owner/repo" format (Discussions enabled, giscus App installed)
  repo: ""
  # 仓库 ID（giscus.app 生成） | Repo ID (generated by giscus.app)
  repoId: ""
  # Discussion 分类名，推荐 "Announcements"（仅维护者可开新讨论，避免访客误开主题帖）
  #
  # Discussion category name; "Announcements" recommended
  # (only maintainers can start discussions, avoiding accidental threads)
  category: "Announcements"
  # 分类 ID（giscus.app 生成） | Category ID (generated by giscus.app)
  categoryId: ""
  # 页面与 Discussion 的映射方式 | Page-to-Discussion mapping
  # pathname, url, title, og:title, specific, number
  mapping: "pathname"
  # 严格标题匹配（SHA-1 校验），避免 GitHub 模糊搜索误配相似标题
  #
  # Strict title matching (SHA-1) to prevent GitHub fuzzy search from mismatching similar titles
  strict: false
  # 是否显示主贴表情反应 | Show emoji reactions on the main post
  reactionsEnabled: true
  # 是否向页面发送 Discussion 元数据（一般保持 false）
  #
  # Send Discussion metadata to the page (usually keep false)
  emitMetadata: false
  # 评论输入框位置
  # ├─ bottom : 列表下方
  # └─ top    : 列表上方
  #
  # Comment input position
  # ├─ bottom : Below list
  # └─ top    : Above list
  inputPosition: "bottom"
  # 明暗两套 giscus 主题（主题键或自定义主题 CSS URL），自动跟随站点明暗切换
  #
  # Light/dark giscus themes (theme keys or custom CSS URLs), auto-switch with site theme
  theme:
    light: "light"
    dark: "dark"
  # 评论语言 | Comment language
  # "auto" 跟随站点语言，或 giscus 语言码（如 "zh-CN"、"en"）
  #
  # "auto" follows site language, or giscus language code (e.g. "zh-CN", "en")
  lang: "auto"
  # giscus client.js 地址；自托管 giscus 时替换为自有地址
  #
  # giscus client.js URL; replace with your own if self-hosting
  scriptUrl: "https://giscus.app/client.js"

# ┌─ ⚠️ Waline 前置要求与注意事项 | Requirements & Notice ──
# │ 需要先部署 Waline 服务端（https://waline.js.org/guide/get-started/）。
# │ serverURL 必填且必须是 http(s) 地址；留空或协议不对时评论区静默关闭（零额外负担）。
# │ 客户端 JS 与 CSS 在评论区进入视口后才加载，升级或自托管时两者须保持同一版本。
# │ 选项以 JSON 写入页面，imageUploader / highlighter / texRenderer 只接受 true / false，
# │ 不支持自定义函数。主题不采集浏览量（pageview 始终关闭）。
# │
# │ Deploy a Waline server first (https://waline.js.org/guide/get-started/).
# │ serverURL is required and must be an http(s) URL; otherwise comments silently disable.
# │ The client JS and CSS load when the comment section enters the viewport;
# │ keep both on the same version when upgrading or self-hosting.
# │ Options reach the browser as JSON: imageUploader / highlighter / texRenderer accept
# │ only true / false, never custom functions. Page views are never collected.
# └──────────────────────────────────────────────────────────
waline:
  # Waline 服务端地址（必填），如 "https://comments.example.com"
  #
  # Waline server URL (required), e.g. "https://comments.example.com"
  serverURL: ""
  # 客户端脚本地址（完整 UMD 构建） | Client script URL (full UMD build)
  scriptUrl: "https://cdn.jsdelivr.net/npm/@waline/client@3.16.1/dist/waline.umd.js"
  # 客户端样式地址，须与 scriptUrl 同版本 | Client stylesheet URL, same version as scriptUrl
  styleUrl: "https://cdn.jsdelivr.net/npm/@waline/client@3.16.1/dist/waline.css"
  # 语言 | Language
  # "auto" 跟随文章/站点语言（未内置的语言回退 "en"），或指定 Waline 语言码，如 "zh-CN"、"en"、"jp"
  #
  # "auto" follows the post/site language (unsupported languages fall back to "en"),
  # or specify a Waline language code such as "zh-CN", "en", "jp"
  lang: "auto"
  # 文案覆盖；省略的字段沿用当前语言的 Waline 默认文案
  #
  # Text overrides; omitted keys keep Waline's defaults for the current language
  locale:
    # 评论输入框提示，空字符串不显示 | Input placeholder; empty string hides it
    placeholder: "Share your thoughts..."
  # 表情：true 使用 Waline 默认表情包，false 关闭；也可填写表情包地址列表
  #
  # Emoji: true uses Waline's default pack, false disables; a list of pack URLs also works
  emoji: true
  # 评论排序 | Comment sorting
  # latest, oldest, hottest
  commentSorting: "latest"
  # 评论者信息字段 | Commenter info fields
  # 可选 nick, mail, link | Choose from nick, mail, link
  meta: ["nick", "mail", "link"]
  # 必填的信息字段；空数组允许匿名评论
  #
  # Required info fields; an empty list allows anonymous comments
  requiredMeta: []
  # 登录模式 | Login mode
  # ├─ enable  : 可登录也可匿名 | Login available, anonymous allowed
  # ├─ disable : 不显示登录 | Hide login
  # └─ force   : 必须登录 | Login required
  login: "enable"
  # 评论字数限制，0 为不限制 | Word limit, 0 for unlimited
  wordLimit: 0
  # 每页评论条数 | Comments per page
  pageSize: 10
  # 图片上传：true 由 Waline 将图片编码为 Base64 随评论提交，false 关闭
  #
  # Image upload: true lets Waline embed images as Base64, false disables
  imageUploader: true
  # 代码高亮：true 使用 Waline 内置高亮器 | Code highlighting with Waline's built-in highlighter
  highlighter: true
  # TeX：true 在预览中提示不支持 TeX，false 不解析 | TeX: true shows an unsupported hint in preview, false ignores TeX
  texRenderer: false
  # 隐藏页脚版权信息 | Hide the footer copyright
  noCopyright: false
  # 隐藏 RSS 订阅链接 | Hide the RSS subscription links
  noRss: true
  # reCAPTCHA v3 站点密钥，留空不启用 | reCAPTCHA v3 site key, empty to disable
  recaptchaV3Key: ""
  # Cloudflare Turnstile 站点密钥，留空不启用 | Cloudflare Turnstile site key, empty to disable
  turnstileKey: ""
  # 文章表情反应：true 显示，false 隐藏，也可填写自定义表情图片地址列表
  #
  # Article reactions: true shows them, false hides them; a list of image URLs also works
  reaction: true
