# ┌──────────────────────────────────────────────────────────
# │ 系列连载配置
# │ 覆盖配置：src/config/seriesConfig.ts
# │
# │ Series configuration
# │ Overrides: src/config/seriesConfig.ts
# └──────────────────────────────────────────────────────────

# 页面与功能总开关：关闭后系列页返回 404，导航/侧栏入口隐藏，文章内系列卡不渲染（零额外负担）
#
# Master switch: when disabled, series page returns 404,
# nav/sidebar entries hide, and post series cards are omitted (zero overhead)
enable: true

# 系列索引页标题：$t: 前缀提取 i18n 词条，普通字符串为字面量覆盖
#
# Series index page title: $t: extracts i18n key, plain string overrides literally
title: "$t:series"

# 系列索引页描述（SEO meta 摘要）：$t: 前缀提取 i18n 词条，普通字符串为字面量覆盖。
# 保持空字符串时，系统自动生成动态统计描述（例如「x 个系列 · y 篇文章」）
#
# Series page description (SEO meta): $t: extracts i18n key, plain string overrides.
# When empty, system auto-generates dynamic stats (e.g. "x series · y posts")
description: ""

# 文章详情页中系列卡片的渲染位置
# ├─ top    : 顶部元信息区下方
# └─ bottom : 正文底部与延伸阅读之后（默认）
#
# Series card position in post detail page
# ├─ top    : Below post header metadata
# └─ bottom : Below post content and related reading (default)
cardPosition: "bottom"
