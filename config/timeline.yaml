# 大事记时间线页配置 | Timeline page configuration
# 覆盖配置 | Overrides: src/config/timelineConfig.ts
# 具体时间线节点清单请在 data/timeline.ts 中维护 | Maintain actual timeline entries in data/timeline.ts

# 页面总开关 | Page master switch
enable: true

# 时间线分类清单 | Timeline category list
categories:
  - key: "milestone"
    label: "里程碑"
    icon: "material-symbols:flag-rounded"

  - key: "project"
    label: "项目"
    icon: "material-symbols:code-rounded"

  - key: "career"
    label: "经历"
    icon: "material-symbols:work-rounded"

  - key: "life"
    label: "生活"
    icon: "material-symbols:favorite-rounded"

# 排序方向 | Sort direction
# desc : 最新在前（默认）| Newest first (default)
# asc  : 最早在前 | Oldest first
order: "desc"

# 可选临时禁用的事件标题清单 | Optional list of temporarily disabled event titles
# disabledTitles: []
