enable: true
source:
  kind: "local"
  fetchOnDev: true
fallback:
  kind: "local"
providers:
  bangumi:
    enable: false
    userId: "demo"
  bilibili:
    enable: false
    vmid: "demo"
    sessdataEnv: "BILI_SESSDATA"
    cover:
      mode: "local"
      useWebp: true
snapshot:
  directory: "src/data/anime-snapshots"
  staleAfterDays: 30
  keepLastValid: true
