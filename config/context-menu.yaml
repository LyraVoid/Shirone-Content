# context-menu.yaml —— 桌面端右键上下文菜单配置
# 覆盖主题的 src/config/contextMenuConfig.ts

# 主开关：是否启用桌面端自定义右键上下文菜单
# 设为 false 时零 DOM 结构、零客户端脚本、零网络请求
enable: true

# 生效页面过滤器：省略或留空表示全站所有页面均生效
# 可选值：home, archive, friends, moments, anime, compass, skills, projects, devices, timeline, albums, about, categories, tags, post, rss, atom
# pages:
#   - post
#   - moments

# 上下文菜单动作清单（按数组顺序自上而下展示）
# 动作类型说明：
# - "copySelection"：复制选中的文本内容（仅在鼠标选中文本时显示）
# - "backToTop"：平滑滚动返回页面顶部（仅在页面发生滚动时显示）
# - "sharePageLink"：复制当前页面完整链接至剪贴板
actions:
  - copySelection
  - backToTop
  - sharePageLink
