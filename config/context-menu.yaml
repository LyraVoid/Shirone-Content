# context-menu.yaml —— 桌面端右键上下文菜单配置 Desktop right-click context menu configuration
# 覆盖主题的 src/config/contextMenuConfig.ts
# Overrides src/config/contextMenuConfig.ts

# 主开关：是否启用桌面端自定义右键上下文菜单
# Main toggle: enable custom right-click context menu on desktop
# 设为 false 时零 DOM、零脚本、零网络请求
# When false: zero DOM, zero scripts, zero network requests
enable: true

# 生效页面过滤器：省略或留空表示全站所有页面均生效
# Page filter: omit or leave empty to apply to all pages
# 可选值 / possible values: home, archive, friends, moments, anime, compass, skills, projects, devices, timeline, albums, about, categories, tags, post, rss, atom
# pages:
#   - post
#   - moments

# 上下文菜单动作清单（按数组顺序自上而下展示）
# Context menu actions list (displayed top-to-bottom in array order)
# 动作类型 / Action types:
# - "copySelection"：复制选中的文本内容（仅在鼠标选中文本时显示）
#         Copy selected text (only shown when text is selected)
# - "backToTop"：平滑滚动返回页面顶部（仅在页面发生滚动时显示）
#         Smooth scroll to top (only shown when page is scrolled)
# - "sharePageLink"：复制当前页面完整链接至剪贴板
#         Copy current page URL to clipboard
actions:
  - copySelection
  - backToTop
  - sharePageLink
