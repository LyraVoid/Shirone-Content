# ┌──────────────────────────────────────────────────────────
# │ 桌面端右键上下文菜单配置
# │ 覆盖配置：src/config/contextMenuConfig.ts
# │
# │ Desktop right-click context menu configuration
# │ Overrides: src/config/contextMenuConfig.ts
# └──────────────────────────────────────────────────────────

# 主开关：是否启用桌面端自定义右键上下文菜单
# 设为 false 时零 DOM、零脚本、零网络请求
#
# Main toggle: enable custom right-click context menu on desktop
# When false: zero DOM, zero scripts, zero network requests
enable: true

# 生效页面过滤器：省略或留空表示全站所有页面均生效
#
# Page filter: omit or leave empty to apply to all pages
# 可选值 | Possible values:
# home, archive, friends, moments, anime, compass, skills, projects, devices,
# timeline, albums, about, categories, tags, post, rss, atom
# pages:
#   - post
#   - moments

# 上下文菜单动作清单（按数组顺序自上而下展示）
#
# Context menu actions list (displayed top-to-bottom in array order)
# 动作类型 | Action types:
# copySelection : 复制选中文本（选中文本时显示）| Copy selected text (only when text selected)
# backToTop     : 平滑返回顶部（页面滚动后显示）| Smooth scroll to top (only when scrolled)
# sharePageLink : 复制当前页面链接至剪贴板 | Copy current page URL to clipboard
actions:
  - copySelection
  - backToTop
  - sharePageLink
