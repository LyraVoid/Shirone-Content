# devices.yaml —— 个人设备展示页配置
# 覆盖主题的 src/config/devicesConfig.ts
# 具体设备条目清单请在 data/devices.ts 中维护

# 页面总开关，关闭后隐藏导航入口并重定向 404
enable: true

# 设备分类清单，数组顺序即顶部筛选标签顺序
categories:
  - key: LapTop
    label: "笔记本"
    icon: "material-symbols:laptop-chromebook-outline-rounded"

  - key: RedMi
    label: "手机"
    icon: "material-symbols:phone-android-outline-rounded"

  - key: Tablet
    label: "平板"
    icon: "material-symbols:tablet-android-outline-rounded"

  - key: Band
    label: "手环"
    icon: "material-symbols:watch-outline-rounded"

  - key: Keyboard
    label: "键盘"
    icon: "material-symbols:keyboard-outline-rounded"

  - key: Mouse
    label: "鼠标"
    icon: "material-symbols:mouse"

  - key: Shoes
    label: "跑鞋"
    icon: "material-symbols:directions-run-rounded"

# 可选临时禁用的设备 ID 清单
# disabledIds: []
