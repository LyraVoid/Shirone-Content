# LLMs 文本端点配置 | LLMs text endpoint configuration
# 覆盖配置 | Overrides: src/config/llmsConfig.ts
# 只写想改的键，其余保持主题默认值；契约说明见 docs/content-separation.md
#
# Only specify keys to change; others use defaults. See docs/content-separation.md

# 是否启用 /llms.txt 与 /llms-full.txt 静态端点生成（默认为 true）
#
# Enable generation of /llms.txt and /llms-full.txt static endpoints (default: true)
enable: true

# 是否同时生成全量正文汇编 /llms-full.txt（默认为 true）
#
# Also generate the full-text compilation /llms-full.txt (default: true)
generateFull: true

# 站点在大模型眼中的自我介绍（可选，留空时自动回退继承 site.subtitle 或 profile.bio）
#
# Site intro for LLMs (optional; falls back to site.subtitle or profile.bio)
# siteSummary: ""

# 单篇文章在 /llms.txt 目录索引中的摘要截断字数上限（默认 200 字）
#
# Max post summary length in /llms.txt index (default: 200)
# descriptionMaxLength: 200

# 敏感标签黑名单过滤（命中任意标签的文章绝不暴露给大模型检索）
#
# Sensitive tag blacklist (matching posts are never exposed to LLM search)
# excludeTags:
#   - "secret"
#   - "private"

# 敏感分类黑名单过滤（属于该分类的文章彻底从 LLM 产物中排除）
#
# Sensitive category blacklist (posts in these categories are excluded from LLMs)
# excludeCategories: []

# 核心引导页面清单（提示：数组整体替换） | Core navigation pages list (note: replaces the entire array)
# corePages:
#   - title: "Home"
#     url: "/"
#     description: "Main blog entrance and latest post stream."
#   - title: "About"
#     url: "/about/"
#     description: "Author profile, technical stack, and background."
#   - title: "Archive"
#     url: "/archive/"
#     description: "Chronological index of all published writings."

# 自定义扩展章节（可选，用于向 AI Agent 额外推荐外部开源项目或衍生资源）
#
# Custom extension sections (optional, recommend external projects or resources)
# customSections: []
