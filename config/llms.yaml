enable: true
generateFull: true
siteSummary: "Shirone 是一个基于 Astro 7、Svelte 5 与 Material 3 Expressive (M3E) 设计体系构建的现代化二次元风格博客主题，采用完全解耦的内容与配置分离架构。"
descriptionMaxLength: 250
excludeTags:
  - "secret"
  - "private"
  - "draft"
excludeCategories: []
corePages:
  - title: "Home"
    url: "/"
    description: "Main blog entrance and latest post stream."
  - title: "About"
    url: "/about/"
    description: "Author profile, technical stack, and background."
  - title: "Archive"
    url: "/archive/"
    description: "Chronological index of all published writings."
  - title: "Moments"
    url: "/moments/"
    description: "Short timeline status updates and daily photo logs."
  - title: "Anime"
    url: "/anime/"
    description: "Bangumi / Bilibili anime collection and ratings."
  - title: "Albums"
    url: "/albums/"
    description: "Visual photo galleries and album collections."
  - title: "Projects"
    url: "/projects/"
    description: "Open source software and community projects."
  - title: "Skills"
    url: "/skills/"
    description: "Technical skills and expertise radar."
  - title: "Timeline"
    url: "/timeline/"
    description: "Major milestone timeline and career records."
  - title: "Devices"
    url: "/devices/"
    description: "Personal digital setup and workstation gear."
  - title: "Compass"
    url: "/compass/"
    description: "Curated web navigation and developer bookmarks."
  - title: "Friends"
    url: "/friends/"
    description: "Friend links and fellow bloggers network."
customSections:
  - title: "Featured Projects"
    description: "Core repositories in the Shirone ecosystem."
    items:
      - title: "Shirone Theme"
        url: "https://github.com/LyraVoid/Shirone"
        description: "A Material 3 Expressive anime blog theme."
      - title: "Shirone Content Template"
        url: "https://github.com/LyraVoid/Shirone-Content"
        description: "Official standalone content & config repository template for Shirone."
