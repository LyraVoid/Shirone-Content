# ┌──────────────────────────────────────────────────────────
# │ 博主个人资料配置
# │ 覆盖配置：src/config/profileConfig.ts
# │
# │ Blogger profile configuration
# │ Overrides: src/config/profileConfig.ts
# └──────────────────────────────────────────────────────────

# 头像路径，支持以 "/" 开头的绝对路径、相对路径或外部网络链接
#
# Avatar path; supports absolute paths starting with "/", relative paths, or external URLs
avatar: "assets/images/demo-avatar.webp"

# 昵称与个人签名 | Nickname and personal signature
name: "Shirone"
bio: "The rain remembers what the sky forgot to say."

# 社交平台链接列表
# 图标支持 Iconify 图标库名称，例如 fa7-brands:xxx、simple-icons:xxx、material-symbols:xxx
#
# Social platform links
# Icons support Iconify library names, e.g. fa7-brands:xxx, simple-icons:xxx, material-symbols:xxx
links:
  - name: "Twitter"
    icon: "fa7-brands:twitter"
    url: "https://twitter.com"
  - name: "Steam"
    icon: "fa7-brands:steam"
    url: "https://store.steampowered.com"
  - name: "GitHub"
    icon: "fa7-brands:github"
    url: "https://github.com/LyraVoid/Shirone"
