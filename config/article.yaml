# 文章详情页配置 | Article detail page configuration
# 覆盖配置 | Overrides: src/config/articleConfig.ts

# 文章最后更新提示 | Article last-updated notice
lastUpdated:
  # 是否开启长期未更新提示 | Enable notice for articles not updated in a long time
  enable: true
  # 触发提示的最小间隔天数，按世界协调时日历日计算，达到该天数开始提示，0 表示立即提示
  #
  # Minimum age in days (UTC) before showing notice; 0 = show immediately
  minimumAgeDays: 90

# 文章底部推荐阅读 | Reading recommendations at the bottom of articles
discovery:
  # 是否开启延伸阅读区域 | Enable the extended reading section
  enable: true
  # 相关文章推荐，基于共享标签或分类 | Related posts based on shared tags or categories
  related:
    enable: true
    count: 3
  # 随机文章推荐 | Random post recommendations
  random:
    enable: true
    count: 2

# 文章社交分享与海报 | Article social sharing and poster
share:
  # 是否展示文章分享区块 | Show the article sharing section
  enable: true
  # 生成分享卡片时是否默认包含文章封面 | Include article cover by default when generating share cards
  includeCover: true
