# ┌──────────────────────────────────────────────────────────
# │ 悬浮操作按钮栏配置
# │ 覆盖配置：src/config/fabConfig.ts
# │
# │ Floating action button bar configuration
# │ Overrides: src/config/fabConfig.ts
# └──────────────────────────────────────────────────────────

# 是否启用右下角悬浮控制按钮 | Enable floating control button in bottom-right corner
enable: true

# 按钮对齐位置
# ├─ start : 靠左
# └─ end   : 靠右
#
# Button alignment
# ├─ start : Left
# └─ end   : Right
align: "end"

# 按钮尺寸 | Button size
# small, regular, large
size: "regular"

# 边距偏移量 | Margin offsets
offset:
  bottom: "var(--m3e-space-8)"
  right: "var(--m3e-space-6)"

# 操作按钮清单，按数组顺序自上而下渲染
# 按钮类型：
# ├─ top     : 返回顶部按钮（滚过横幅后浮现）
# ├─ toc     : 文章目录抽屉按钮
# ├─ comment : 直达评论区按钮
# └─ home    : 返回首页按钮（可设仅子页面显示）
#
# Action buttons list, rendered top-to-bottom in array order
# Button types:
# ├─ top     : Back-to-top button (appears after scrolling past banner)
# ├─ toc     : Table of contents drawer button
# ├─ comment : Jump to comments button
# └─ home    : Home button (can be limited to subpages)
items:
  - type: "top"
    enable: true
    devices: ["mobile", "tablet", "desktop"]

  - type: "toc"
    enable: true
    devices: ["mobile", "tablet"]
    pages: ["post"]
    depth: 3
    closeOnSelect: true

  - type: "comment"
    enable: true
    devices: ["mobile", "tablet"]
    pages: ["post"]

  - type: "home"
    enable: true
    devices: ["mobile", "tablet"]
    onlySubPages: true
