# ┌──────────────────────────────────────────────────────────
# │ 文章固定链接配置
# │ 覆盖配置：src/config/permalinkConfig.ts
# │ 全局文章 URL 格式模板与启用开关
# │
# │ Permalink configuration
# │ Overrides: src/config/permalinkConfig.ts
# │ Global post URL format template and master switch
# └──────────────────────────────────────────────────────────

# 是否开启全局固定链接（默认 false，关闭时文章链接为 /posts/<slug>/）
#
# Enable global permalinks (default false; post links are /posts/<slug>/ when disabled)
enable: false

# 全局固定链接格式模板（仅在 enable 为 true 时生效）
#
# Global permalink format template (only applies when enable is true)
#
# 常见 URL 风格示例（开箱即用）：
# ├─ 精简别名（默认） : "%postname%"                   => /my-post/
# ├─ 年月归档风格     : "%year%/%monthnum%/%postname%" => /2024/12/my-post/
# ├─ 递增序号风格     : "%post_id%-%postname%"         => /42-my-post/
# └─ 分类层级风格     : "%category%/%postname%"        => /tech/my-post/
#
# Common URL preset patterns:
# ├─ Slug only (default) : "%postname%"                   => /my-post/
# ├─ Year/Month archive  : "%year%/%monthnum%/%postname%" => /2024/12/my-post/
# ├─ Incremental ID      : "%post_id%-%postname%"         => /42-my-post/
# └─ Category hierarchy  : "%category%/%postname%"        => /tech/my-post/
#
# 占位符速查 | Placeholders:
# 日期时间 : %year%(4位年) · %monthnum%(2位月) · %day%(2位日) · %hour% · %minute% · %second%
# 文章属性 : %post_id%(发布递增序号) · %postname%(小写别名) · %raw_postname%(原文件名) · %category%(分类)
#
# 路径首尾的多余 "/" 会自动规范化，也可在单篇文章 frontmatter 中用 permalink 字段覆盖
#
# Extra leading/trailing "/" are auto-normalized; can be overridden in post frontmatter
format: "%postname%"
