# ┌──────────────────────────────────────────────────────────
# │ 侧栏音乐播放器配置
# │ 覆盖配置：src/config/musicConfig.ts
# │
# │ Sidebar music player configuration
# │ Overrides: src/config/musicConfig.ts
# └──────────────────────────────────────────────────────────

# 是否启用侧栏音乐播放器组件 | Enable sidebar music player component
enable: true

# 播放器工作模式
# ├─ local  : 本地模式，读取 data/music.ts，零外部请求
# ├─ custom : 自定义模式，直接在下方 tracks 字段配置
# ├─ meting : 云端歌单模式，按需拉取网易云/QQ音乐歌单
# └─ mixed  : 混合模式，首屏本地可播 + 云端网络降级
#
# Player mode
# ├─ local  : Local mode (reads data/music.ts, zero requests)
# ├─ custom : Custom mode (configured directly in tracks field)
# ├─ meting : Cloud playlist mode (Meting API for playlists)
# └─ mixed  : Mixed mode (instant local play with network fallback)
provider: "mixed"

# 默认音量，范围 0.0 到 1.0 | Default volume, range 0.0-1.0
defaultVolume: 0.7

# 默认播放循环模式
# ├─ sequence : 顺序播放
# ├─ loop     : 单曲循环
# └─ random   : 随机播放
#
# Default playback loop mode
# ├─ sequence : Sequential
# ├─ loop     : Single track repeat
# └─ random   : Shuffle
defaultMode: "sequence"

# 云端歌单配置，用于 meting 与 mixed 模式
#
# Cloud playlist configuration for meting and mixed modes
meting:
  # 音乐平台 | Music platform
  # netease, tencent, kugou
  server: "netease"
  # 资源类型 | Resource type
  # playlist, song, album, artist
  type: "playlist"
  # 歌单或歌曲 ID | Playlist or song ID
  id: "14164869977"
  # 自建 Meting API 地址，留空使用默认公开接口
  #
  # Self-hosted Meting API URL; leave empty for default public endpoint
  # api: "https://api.example.com/meting"

# 自定义曲目清单，用于 custom 模式 | Custom track list for custom mode
# tracks:
#   - id: "custom-1"
#     title: "示例曲目"
#     artist: "艺术家"
#     cover: "/assets/music/cover/example.webp"
#     source: "/assets/music/url/example.mp3"
#     duration: 240
