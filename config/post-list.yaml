# 文章列表页布局配置 | Post list page layout configuration
# 覆盖配置 | Overrides: src/config/postListConfig.ts

# 每页展示文章数量 | Posts per page
pageSize: 8

# 文章列表排版布局 | Post list layout
layout:
  # 初始排版模式 | Initial layout mode
  # list : 单列列表 | Single-column list
  # grid : 多列卡片 | Multi-column cards
  mode: "list"

  # 封面图片放置方向 | Cover image position
  # left  : 靠左 | Left
  # right : 靠右 | Right
  cover: "right"

  # 网格卡片宽度档位，仅在 mode: "grid" 时生效 | Grid card width tier, only applies when mode is "grid"
  # compact : 紧凑卡片（最小 20rem，高密度）| Compact (min 20rem, high-density)
  # regular : 标准卡片（最小 24rem，默认推荐）| Regular (min 24rem, recommended)
  # relaxed : 宽松大卡（最小 28rem，突出大图）| Relaxed (min 28rem, large image focus)
  cardWidth: "regular"
