# post-list.yaml —— 文章列表页布局配置 Post list page layout configuration
# 覆盖主题的 src/config/postListConfig.ts
# Overrides src/config/postListConfig.ts

# 每页展示文章数量 / Posts per page
pageSize: 8

# 文章列表排版布局 / Post list layout
layout:
  # 初始排版模式 / Initial layout mode
  # "list" 单列列表，"grid" 多列卡片网格
  # "list" single column, "grid" multi-column cards
  mode: "list"

  # 封面图片放置方向 / Cover image position
  # "left" 靠左，"right" 靠右
  # "left" or "right"
  cover: "right"

  # 网格卡片宽度档位，仅在 mode: "grid" 时生效 / Grid card width tier, only applies when mode is "grid"
  # - "compact"：紧凑卡片，最小宽度 20rem，适合高密度展示
  # - "compact": min-width 20rem, high-density display
  # - "regular"：标准卡片，最小宽度 24rem，默认推荐
  # - "regular": min-width 24rem, default recommendation
  # - "relaxed"：宽松大卡，最小宽度 28rem，突出大图质感
  # - "relaxed": min-width 28rem, emphasizes large image quality
  cardWidth: "regular"
