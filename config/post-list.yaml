# ┌──────────────────────────────────────────────────────────
# │ 文章列表页布局配置
# │ 覆盖配置：src/config/postListConfig.ts
# │
# │ Post list page layout configuration
# │ Overrides: src/config/postListConfig.ts
# └──────────────────────────────────────────────────────────

# 每页展示文章数量 | Posts per page
pageSize: 8

# 文章列表排版布局 | Post list layout
layout:
  # 初始排版模式
  # ├─ list : 单列列表
  # └─ grid : 多列卡片
  #
  # Initial layout mode
  # ├─ list : Single-column list
  # └─ grid : Multi-column cards
  mode: "list"

  # 封面图片放置方向
  # ├─ left  : 靠左
  # └─ right : 靠右
  #
  # Cover image position
  # ├─ left  : Left
  # └─ right : Right
  cover: "right"

  # 网格卡片宽度档位（仅 mode: "grid" 生效）
  # ├─ compact : 紧凑卡片（最小 20rem，高密度）
  # ├─ regular : 标准卡片（最小 24rem，默认推荐）
  # └─ relaxed : 宽松大卡（最小 28rem，突出大图）
  #
  # Grid card width tier (only applies when mode is "grid")
  # ├─ compact : Compact (min 20rem, high-density)
  # ├─ regular : Regular (min 24rem, recommended)
  # └─ relaxed : Relaxed (min 28rem, large image focus)
  cardWidth: "regular"
