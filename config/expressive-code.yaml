# 代码高亮主题配置 | Code highlighting theme configuration
# 覆盖配置 | Overrides: src/config/expressiveCodeConfig.ts

# 代码块默认高亮主题 | Default code block highlighting theme
theme: "github-dark"

# 浅色模式下的高亮主题 | Highlighting theme for light mode
lightTheme: "github-light"

# 深色模式下的高亮主题 | Highlighting theme for dark mode
darkTheme: "github-dark"
