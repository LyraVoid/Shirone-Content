# ┌──────────────────────────────────────────────────────────
# │ 侧边栏布局与组件编排
# │ 覆盖配置：src/config/sidebarConfig.ts
# │
# │ Sidebar layout and components
# │ Overrides: src/config/sidebarConfig.ts
# └──────────────────────────────────────────────────────────

# 是否全局启用侧栏 | Enable sidebar globally
enable: true

# 侧栏编排模式
# ├─ single : 单栏模式（全部组件放入主侧栏，紧凑布局）
# └─ dual   : 双栏模式（副栏组件在宽屏展开于另一侧）
#
# Sidebar arrangement mode
# ├─ single : Single column (all in main sidebar, compact)
# └─ dual   : Dual column (secondary expands on wide screens)
arrangement: "dual"

# 主侧栏物理位置
# ├─ left  : 靠左
# └─ right : 靠右
#
# Main sidebar position
# ├─ left  : Left
# └─ right : Right
side: "left"

# 侧边栏组件清单，按数组顺序自上而下渲染
# 属性说明：
# - type: 组件类型（profile, music, announcement, categories, tags, stats, calendar, toc）
# - slot: 放置位置（"top" 顶部固定 | "sticky" 滚动吸顶）
# - column: 所在栏位（"primary" 主栏 | "secondary" 副栏，仅 dual 模式生效）
# - pages: 可见页面过滤，省略时全页面生效
# - collapseAfter: 折叠阈值，超出条数显示展开按钮
#
# Sidebar component list, rendered top to bottom in array order.
# Properties:
# - type: component type (profile, music, announcement, categories, tags, stats, calendar, toc)
# - slot: placement ("top" at top | "sticky" follows scrolling)
# - column: column ("primary" or "secondary", dual mode only)
# - pages: visibility filter; omit for all pages
# - collapseAfter: collapse threshold; shows expand button when exceeded
components:
  - type: "profile"
    enable: true
    slot: "top"

  - type: "music"
    enable: true
    slot: "top"

  - type: "announcement"
    enable: true
    slot: "top"
    pages:
      - "home"

  - type: "categories"
    enable: true
    slot: "sticky"
    collapseAfter: 5

  - type: "tags"
    enable: true
    slot: "sticky"
    collapseAfter: 6

  - type: "stats"
    enable: true
    slot: "top"
    column: "secondary"
    pages:
      - "home"
      - "archive"
      - "categories"
      - "tags"

  - type: "calendar"
    enable: true
    slot: "top"
    column: "secondary"

  - type: "toc"
    enable: true
    slot: "sticky"
    column: "secondary"
    pages:
      - "post"
