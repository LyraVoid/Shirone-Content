# sidebar.yaml —— 侧边栏布局与组件编排配置
# 覆盖主题的 src/config/sidebarConfig.ts

# 是否全局启用侧栏
enable: true

# 侧栏编排模式：
# - "single"：单栏模式，所有组件放入主侧栏，紧凑布局
# - "dual"：双栏模式，副栏组件在宽屏展开于屏幕另一侧
arrangement: "dual"

# 主侧栏物理位置："left" 左侧，"right" 右侧
side: "left"

# 侧边栏组件清单，按数组顺序自上而下渲染
# 属性说明：
# - type: 组件类型 ("profile" | "music" | "announcement" | "categories" | "tags" | "stats" | "calendar" | "toc")
# - slot: 放置位置 ("top" 固定在顶部 | "sticky" 滚动吸顶跟随)
# - column: 所在栏位 ("primary" 主栏 | "secondary" 副栏，仅在 dual 模式生效)
# - pages: 可见页面范围过滤，省略时全页面生效
# - collapseAfter: 折叠阈值，超出条数显示展开按钮
components:
  - type: "profile"
    enable: true
    slot: "top"

  - type: "music"
    enable: true
    slot: "top"

  - type: "announcement"
    enable: true
    slot: "top"
    pages:
      - "home"

  - type: "categories"
    enable: true
    slot: "sticky"
    collapseAfter: 5

  - type: "tags"
    enable: true
    slot: "sticky"
    collapseAfter: 6

  - type: "stats"
    enable: true
    slot: "top"
    column: "secondary"
    pages:
      - "home"
      - "archive"
      - "categories"
      - "tags"

  - type: "calendar"
    enable: true
    slot: "top"
    column: "secondary"

  - type: "toc"
    enable: true
    slot: "sticky"
    column: "secondary"
    pages:
      - "post"
