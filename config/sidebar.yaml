# ┌──────────────────────────────────────────────────────────
# │ 侧边栏布局与组件编排
# │ 覆盖配置：src/config/sidebarConfig.ts
# │
# │ Sidebar layout and components
# │ Overrides: src/config/sidebarConfig.ts
# └──────────────────────────────────────────────────────────

# ── 布局与编排模式 | Layout & Mode ─────────────────────────

# 是否全局启用侧栏 | Enable sidebar globally
enable: true

# 侧栏编排模式
# ├─ single : 单栏模式（全部组件放入主侧栏，紧凑布局）
# └─ dual   : 双栏模式（副栏组件在宽屏展开于另一侧）
#
# Sidebar arrangement mode
# ├─ single : Single column (all in main sidebar, compact)
# └─ dual   : Dual column (secondary expands on wide screens)
arrangement: "dual"

# 主侧栏物理位置
# ├─ left  : 靠左
# └─ right : 靠右
#
# Main sidebar position
# ├─ left  : Left
# └─ right : Right
side: "left"

# ── 组件清单编排 | Component Orchestration ─────────────────

# 侧边栏组件清单，按数组顺序自上而下渲染
#
# 组件属性速查表 | Component Properties:
# 属性 / Property    说明 / Description         候选值 / Options
# ───────────────── ────────────────────────── ──────────────────────────────────
# type            : 组件类型                 profile, music, categories, ...
# slot            : 放置位置                 "top"(顶部固定) | "sticky"(吸顶跟随)
# column          : 所在栏位 (仅 dual 模式)  "primary"(主栏) | "secondary"(副栏)
# pages           : 页面过滤                 省略时全站所有页面生效
# collapseAfter   : 折叠阈值                 超出条数显示展开按钮
components:
  - type: "profile"
    enable: true
    slot: "top"

  - type: "music"
    enable: true
    slot: "top"

  - type: "announcement"
    enable: true
    slot: "top"
    pages:
      - "home"

  - type: "categories"
    enable: true
    slot: "sticky"
    collapseAfter: 5

  - type: "tags"
    enable: true
    slot: "sticky"
    collapseAfter: 6

  - type: "stats"
    enable: true
    slot: "top"
    column: "secondary"
    pages:
      - "home"
      - "archive"
      - "categories"
      - "tags"

  - type: "calendar"
    enable: true
    slot: "top"
    column: "secondary"

  - type: "toc"
    enable: true
    slot: "sticky"
    column: "secondary"
    pages:
      - "post"
